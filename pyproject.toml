[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleclick-vastai-api"
version = "0.1.0"
description = "Production-oriented FastAPI service for SimpleClick interactive segmentation."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "gdown>=5.2,<6",
    "numpy==1.23.5",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=9.5,<12",
    "PyYAML>=6,<7",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "protobuf==3.20.3",
    "tensorboard==2.8.0",
    "albumentations==0.5.2",
    "Cython==0.29.32",
    "easydict>=1.9,<2",
    "mmcv==1.6.2",
    "scipy>=1.10,<2",
    "timm==0.6.11",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
